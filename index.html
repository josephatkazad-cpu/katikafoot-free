<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katikafoot — Version Gratuite</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="container">
            <a href="#" class="logo">Katika<span>foot</span> <small class="badge-free">Gratuit</small></a>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>Comprenez le match avant le coup d'envoi</h1>
            <p>Accès libre aux statistiques et analyses d'avant-match.</p>
        </div>
    </section>

    <main class="container content">
        <h2>Analyses du Jour</h2>
        <div class="cards-grid">
            <article class="match-card">
                <div class="match-header">
                    <span class="league">Ligue des Champions</span>
                    <span class="status">Aujourd'hui - 21:00</span>
                </div>
                <div class="teams">
                    <span class="team-name">Real Madrid</span>
                    <span class="vs">VS</span>
                    <span class="team-name">Bayern Munich</span>
                </div>
                <div class="analysis-box">
                    <h4>Analyse :</h4>
                    <p>Forte probabilité de plus de 2.5 buts au vu de la forme des deux équipes.</p>
                </div>
            </article>
        </div>
    </main>

</body>
</html>
